<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유튜브 영상 비교 분석</title>
<style>
*{box-sizing:border-box;border-radius:0}
body{margin:0;background:#fff;color:#000;font:15px/1.65 Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:1080px;margin:0 auto;padding:64px 24px 96px}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em}
.lead{margin:6px 0 40px;color:#6b6b6b}
form{display:grid;grid-template-columns:1fr 1fr auto;gap:24px;align-items:end}
label span{display:block;margin-bottom:2px;font-size:12px;color:#6b6b6b}
input{width:100%;padding:8px 0;border:0;border-bottom:1px solid #000;background:transparent;color:#000;font:inherit}
input::placeholder{color:#b5b5b5}
input:focus-visible{outline:0;border-bottom-width:2px;padding-bottom:7px}
button{padding:10px 30px;border:0;background:#000;color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:focus-visible{outline:2px solid #000;outline-offset:3px}
button:disabled{background:#b5b5b5;cursor:default}
#msg{margin:16px 0 0;color:#6b6b6b}
.grid{display:grid;grid-template-columns:1fr 1fr;margin-top:56px;align-items:start}
.col{min-width:0;padding:0 32px}
.col:first-child{padding-left:0}
.col+.col{padding-right:0;border-left:1px solid #e6e6e6}
img.th{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.title{margin:16px 0 4px;font-size:19px;font-weight:600;line-height:1.4}
.sub{margin:0;color:#6b6b6b;font-size:13px}
.stats{display:flex;gap:36px;margin-top:24px}
.stats strong{display:block;font-size:26px;font-weight:600;line-height:1.2}
.stats span{font-size:12px;color:#6b6b6b}
h2{margin:48px 0 14px;padding-top:12px;border-top:1px solid #000;font-size:13px;font-weight:600}
h2 .mu{font-weight:400}
canvas{display:block;width:100%;height:auto}
ol{margin:0;padding:0;list-style:none}
.rk{color:#b5b5b5}
.wl li{position:relative;display:grid;grid-template-columns:28px 1fr auto;padding:9px 0;border-bottom:1px solid #e6e6e6}
.wl i{position:absolute;left:0;bottom:-1px;height:2px;background:#000}
.cl li{display:grid;grid-template-columns:28px 1fr;padding:14px 0;border-bottom:1px solid #e6e6e6}
.cl .top{display:flex;justify-content:space-between;gap:12px}
.cl .meta{display:flex;gap:14px;font-size:12px;color:#6b6b6b}
.cl p{margin:6px 0 0;white-space:pre-wrap;word-break:break-word}
.mu{color:#6b6b6b}
.info>p,.cmt>p{margin:0;padding:10px 0}
@media(max-width:760px){
  main{padding:40px 16px 64px}
  form,.grid{grid-template-columns:1fr}
  form{gap:20px}
  .col,.col:first-child,.col+.col{padding:0;border:0}
  .col+.col{margin-top:56px;padding-top:40px;border-top:1px solid #000}
}
</style>
</head>
<body>
<main>
  <h1>유튜브 영상 비교</h1>
  <p class="lead">두 영상의 통계와 댓글을 나란히 확인합니다.</p>
  <form id="f">
    <label><span>영상 A</span><input id="a" placeholder="https://youtu.be/..." required></label>
    <label><span>영상 B</span><input id="b" placeholder="https://youtu.be/..." required></label>
    <button id="go">분석</button>
  </form>
  <p id="msg"></p>
  <div class="grid" id="out"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
<script>
const WORKER = "https://yt-compare.pcofjeongchan.workers.dev/"; // ← 배포한 Worker 주소로 교체
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = x => x == null ? "비공개" : Number(x).toLocaleString("ko-KR");
const when = iso => new Date(iso).toLocaleString("ko-KR");

function parseId(s) {
  s = s.trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  try {
    const u = new URL(s);
    if (u.hostname === "youtu.be") return u.pathname.slice(1, 12);
    if (u.searchParams.get("v")) return u.searchParams.get("v");
    const m = u.pathname.match(/\/(?:shorts|embed|live)\/([\w-]{11})/);
    if (m) return m[1];
  } catch {}
  return null;
}

const get = (id, qs) =>
  fetch(`${WORKER}/?id=${id}&${qs}`).then(async r => {
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    return j;
  });

function fillInfo(el, d) {
  el.querySelector(".info").innerHTML = `
    <img class="th" src="${esc(d.thumbnail || "")}" alt="">
    <p class="title">${esc(d.title)}</p>
    <p class="sub">${esc(d.channel)}</p>
    <p class="sub">${when(d.publishedAt)}</p>
    <div class="stats">
      <div><strong>${num(d.stats.views)}</strong><span>조회수</span></div>
      <div><strong>${num(d.stats.likes)}</strong><span>좋아요</span></div>
      <div><strong>${num(d.stats.comments)}</strong><span>댓글</span></div>
    </div>`;
}

function fillComments(el, d, final) {
  const max = d.words[0]?.[1] || 1;
  const note = final ? "" : " · 나머지 불러오는 중…";
  el.querySelector(".cmt").innerHTML = `
    <h2>댓글 워드클라우드 <span class="mu">분석 댓글 ${d.sampled}개${note}</span></h2>
    ${d.commentsOff ? '<p class="mu">댓글을 불러올 수 없습니다(비활성화 등).</p>' : '<canvas width="560" height="320"></canvas>'}
    <h2>자주 등장한 단어 TOP 10</h2>
    <ol class="wl">${d.words.slice(0, 10).map(([w, c], i) => `
      <li><span class="rk">${i + 1}</span><span>${esc(w)}</span><span class="mu">${c}</span><i style="width:${c / max * 100}%"></i></li>`).join("")}</ol>
    <h2>좋아요 TOP 10 댓글</h2>
    <ol class="cl">${d.topComments.map((c, i) => `
      <li><span class="rk">${i + 1}</span><div>
        <div class="top"><b>${esc(c.author)}</b><span>좋아요 ${num(c.likes)}</span></div>
        <div class="meta"><span>${when(c.publishedAt)}</span><span>답글 ${num(c.replies)}</span></div>
        <p>${esc(c.text)}</p></div></li>`).join("")}</ol>`;

  const cv = el.querySelector("canvas");
  if (cv && d.words.length) {
    const colors = ["#000", "#222", "#444", "#666"];
    WordCloud(cv, {
      list: d.words,
      gridSize: 8,
      weightFactor: s => 12 + (s / max) * 52,
      fontFamily: 'Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif',
      color: () => colors[Math.random() * colors.length | 0],
      backgroundColor: "transparent",
      rotateRatio: 0,
    });
  }
}

// 영상 하나를 3단계로 나눠서 도착하는 대로 화면에 그림
async function analyze(id) {
  const el = document.createElement("section");
  el.className = "col";
  el.innerHTML = '<div class="info"><p class="mu">영상 정보를 불러오는 중…</p></div><div class="cmt"></div>';
  $("#out").append(el);
  let loaded = false;
  try {
    fillInfo(el, await get(id, "mode=info"));                         // 1단계: 제목·통계 (즉시)
    loaded = true;
    el.querySelector(".cmt").innerHTML = '<p class="mu">댓글 분석 중…</p>';
    fillComments(el, await get(id, "mode=comments&pages=1"), false);  // 2단계: 댓글 100개 미리보기
    const full = await get(id, "mode=comments&pages=5").catch(() => null);
    if (full) fillComments(el, full, true);                           // 3단계: 최대 500개 전체
    else el.querySelector("h2 .mu").textContent = "(분석 댓글 100개)";
  } catch (err) {
    el.querySelector(loaded ? ".cmt" : ".info").innerHTML = `<p class="mu">분석에 실패했습니다: ${esc(err.message)}</p>`;
  }
}

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const ids = [$("#a").value, $("#b").value].map(parseId);
  if (ids.includes(null)) return $("#msg").textContent = "영상 링크를 확인해 주세요. (watch?v=, youtu.be, shorts 형식 지원)";
  $("#go").disabled = true;
  $("#msg").textContent = "";
  $("#out").innerHTML = "";
  await Promise.all(ids.map(analyze));
  $("#go").disabled = false;
});
</script>
</body>
</html>
