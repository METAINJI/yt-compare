<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유튜브 영상 댓글 비교 분석</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg:#eef1f5; --card:#fff; --ink:#14202e; --sub:#5d6b7b; --line:#d9e0e8; --a:#2457d6; --b:#d6336c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif; line-height:1.55; }
  main { max-width:1180px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:28px; margin:0 0 4px; letter-spacing:-.02em; }
  .lead { color:var(--sub); margin:0 0 24px; }
  .inputs { display:grid; grid-template-columns:1fr 1fr auto; gap:12px; align-items:end; }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; }
  .la { color:var(--a); } .lb { color:var(--b); }
  input { width:100%; padding:12px 14px; font:inherit; border:2px solid var(--line); border-radius:8px; background:#fff; }
  #u1:focus { border-color:var(--a); outline:none; } #u2:focus { border-color:var(--b); outline:none; }
  button { padding:13px 26px; font:inherit; font-weight:700; color:#fff; background:var(--ink); border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  button:focus-visible { outline:3px solid var(--a); outline-offset:2px; }
  #grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:28px; }
  .col { background:var(--card); border-top:6px solid var(--c); border-radius:10px; padding:20px; min-width:0; }
  .col.a { --c:var(--a); } .col.b { --c:var(--b); }
  .head { display:flex; gap:14px; }
  .head img { width:132px; height:74px; object-fit:cover; border-radius:6px; flex:none; }
  .head h2 { font-size:17px; margin:0 0 4px; line-height:1.35; }
  .meta { color:var(--sub); font-size:13px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:18px 0; }
  .stat { background:var(--bg); border-radius:8px; padding:10px 12px; }
  .stat b { display:block; font-size:20px; color:var(--c); font-variant-numeric:tabular-nums; }
  .stat span { font-size:12px; color:var(--sub); }
  h3 { font-size:15px; margin:22px 0 8px; }
  canvas { width:100%; height:300px; background:var(--bg); border-radius:8px; display:block; }
  ol { margin:0; padding:0; list-style:none; }
  .words li { display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); }
  .words .bar { flex:1; align-self:center; height:6px; background:var(--bg); border-radius:3px; overflow:hidden; }
  .words .bar i { display:block; height:100%; background:var(--c); }
  .words em { font-style:normal; font-variant-numeric:tabular-nums; color:var(--sub); min-width:36px; text-align:right; }
  .cm { padding:12px 0; border-bottom:1px solid var(--line); }
  .cm p { margin:6px 0 0; white-space:pre-wrap; word-break:break-word; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .cm .top { font-size:13px; color:var(--sub); }
  .cm .top strong { color:var(--ink); }
  .likes { color:var(--c); font-weight:700; }
  .err { color:#b42318; background:#fdecea; padding:12px 14px; border-radius:8px; }
  .note { color:var(--sub); font-size:13px; }
  @media (max-width:820px) { .inputs, #grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <h1>유튜브 영상 2개 비교 분석</h1>
  <p class="lead">영상 링크 두 개를 넣으면 통계, 인기 댓글, 댓글 속 단어를 나란히 보여 드려요.</p>

  <div class="inputs">
    <div><label class="la" for="u1">영상 A 링크</label><input id="u1" placeholder="https://www.youtube.com/watch?v=..."></div>
    <div><label class="lb" for="u2">영상 B 링크</label><input id="u2" placeholder="https://youtu.be/..."></div>
    <button id="go">분석하기</button>
  </div>

  <div id="grid"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const num = (n) => (n == null ? '비공개' : n.toLocaleString('ko-KR'));
const date = (d) => new Date(d).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' });
const COLORS = { a: ['#2457d6', '#1b3f9c', '#4b7cf0', '#14202e'], b: ['#d6336c', '#a3214f', '#f0618f', '#14202e'] };

function render(el, side, d) {
  if (d.error) { el.innerHTML = `<div class="err">${esc(d.error)}</div>`; return; }
  const max = d.words[0]?.[1] || 1;
  const top10 = d.words.slice(0, 10);
  el.innerHTML = `
    <div class="head">
      <img src="${esc(d.thumbnail || '')}" alt="">
      <div><h2>${esc(d.title)}</h2><div class="meta">${esc(d.channel)} · ${date(d.publishedAt)}</div></div>
    </div>
    <div class="stats">
      <div class="stat"><b>${num(d.stats.views)}</b><span>조회수</span></div>
      <div class="stat"><b>${num(d.stats.likes)}</b><span>좋아요</span></div>
      <div class="stat"><b>${d.commentsDisabled ? '사용 안 함' : num(d.stats.comments)}</b><span>댓글</span></div>
    </div>
    ${d.commentsDisabled ? '<p class="note">이 영상은 댓글이 닫혀 있어 댓글 분석을 할 수 없어요.</p>' : `
    <h3>댓글 단어 워드클라우드</h3>
    <canvas></canvas>
    <p class="note">인기순 상위 ${num(d.analyzedComments)}개 댓글 기준이에요.</p>
    <h3>자주 등장한 단어 TOP 10</h3>
    <ol class="words">${top10.map(([w, n], i) =>
      `<li><span>${i + 1}. ${esc(w)}</span><span class="bar"><i style="width:${(n / max) * 100}%"></i></span><em>${n}회</em></li>`).join('')}</ol>
    <h3>좋아요 많은 댓글 TOP 10</h3>
    <ol>${d.topComments.map((c, i) => `
      <li class="cm">
        <div class="top">${i + 1}. <strong>${esc(c.author)}</strong> · ${date(c.publishedAt)} · 좋아요 <span class="likes">${num(c.likes)}</span> · 답글 ${num(c.replies)}</div>
        <p>${esc(c.text)}</p>
      </li>`).join('')}</ol>`}`;

  const cv = el.querySelector('canvas');
  if (cv && d.words.length) {
    const r = devicePixelRatio || 1;
    cv.width = cv.clientWidth * r; cv.height = cv.clientHeight * r;
    WordCloud(cv, {
      list: d.words,
      gridSize: 8 * r,
      weightFactor: (n) => (14 + (n / max) * 52) * r,
      fontFamily: 'Pretendard, "Noto Sans KR", sans-serif',
      fontWeight: 700,
      color: () => COLORS[side][Math.floor(Math.random() * 3)],
      backgroundColor: '#eef1f5',
      rotateRatio: 0.2,
      shrinkToFit: true,
    });
  }
}

async function analyze(url) {
  try {
    const r = await fetch('/api/analyze?url=' + encodeURIComponent(url));
    return await r.json();
  } catch (e) { return { error: '서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.' }; }
}

$('#go').onclick = async () => {
  const urls = [$('#u1').value.trim(), $('#u2').value.trim()];
  if (!urls[0] || !urls[1]) { $('#grid').innerHTML = '<div class="err" style="grid-column:1/-1">링크를 두 개 모두 입력해 주세요.</div>'; return; }
  const btn = $('#go'); btn.disabled = true; btn.textContent = '분석 중...';
  $('#grid').innerHTML = '<div class="col a"><p class="note">영상 A 분석 중...</p></div><div class="col b"><p class="note">영상 B 분석 중...</p></div>';
  const [a, b] = await Promise.all(urls.map(analyze));
  const [ea, eb] = [...document.querySelectorAll('.col')];
  render(ea, 'a', a); render(eb, 'b', b);
  btn.disabled = false; btn.textContent = '분석하기';
};
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') $('#go').click(); });
</script>
</body>
</html>
